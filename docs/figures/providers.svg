<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 484" width="880" height="484" role="img" aria-labelledby="title desc">
<title id="title">Where a run's sandboxes run, and how their images reach them</title>
<desc id="desc">On the operator's machine, pumpkin builds images on the machine's Docker engine, where the Docker provider also runs its sandboxes as containers. A machine whose configuration names a controller sends its runs, over ssh, to the controller, which runs the same pumpkin and is an EC2 instance in the operator's AWS account or a privileged container on a Docker host. The EC2 controller builds the images on its own Docker engine, pushes them to private ECR repositories, launches EC2 instances that pull them, one sandbox each, and creates Modal sandboxes, which Modal imports from the same repositories, and whose companions run as Modal's sidecars. The Docker controller builds the images on a Docker engine of its container's own, never the host's, where the Docker provider also runs its sandboxes as containers.</desc>
<style>
:root{--bg:#ffffff;--ink:#1f2328;--mute:#59636e;--line:#818b98;--card:#f6f8fa;--hot:#0969da;--hot-bg:#ddf4ff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#6e7681;--card:#151b23;--hot:#58a6ff;--hot-bg:#10243e}}
text{font:12.5px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.code{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.name{font-size:13px;font-weight:600}
.note{font-size:11.5px;fill:var(--mute)}
.zone-label{font-size:10px;font-weight:700;letter-spacing:.8px;fill:var(--mute)}
.mid{text-anchor:middle}
.bg{fill:var(--bg)}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.25}
.hot{fill:var(--hot-bg);stroke:var(--hot);stroke-width:1.5}
.zone{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:6 4}
.arrow{fill:none;stroke:var(--line);stroke-width:1.5}
.head{fill:var(--line)}
</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L8 4L0 8z"/></marker></defs>
<rect class="bg" width="880" height="484"/>

<rect class="zone" x="16" y="16" width="228" height="320" rx="12"/>
<text class="zone-label" x="32" y="38">THE OPERATOR'S MACHINE</text>
<rect class="box" x="32" y="56" width="196" height="60" rx="8"/>
<text class="code mid" x="130" y="80">pumpkin</text><text class="note mid" x="130" y="98">check, run, wait, ls, view</text>
<path class="arrow" d="M130 117V164" marker-end="url(#head)"/>
<text class="note" x="138" y="144">builds, runs</text>
<rect class="box" x="32" y="166" width="196" height="76" rx="8"/>
<text class="name mid" x="130" y="190">the Docker engine</text>
<text class="note mid" x="130" y="208">builds every image; the Docker</text>
<text class="note mid" x="130" y="223">provider's containers run here</text>
<text class="note" x="32" y="272">with no [controllers] in its</text>
<text class="note" x="32" y="287">configuration, the machine</text>
<text class="note" x="32" y="302">runs its runs itself, on its</text>
<text class="note" x="32" y="317">engine or on EC2 and Modal</text>

<path class="arrow" d="M229 86H314" marker-end="url(#head)"/>
<text class="note mid" x="272" y="78">ssh</text>
<path class="arrow" d="M229 106H282V398H314" marker-end="url(#head)"/>
<text class="note mid" x="263" y="256">ssh</text>

<rect class="zone" x="300" y="16" width="372" height="272" rx="12"/>
<text class="zone-label" x="316" y="38">THE OPERATOR'S AWS, AS DEPLOY/AWS MAKES IT</text>
<rect class="hot" x="316" y="56" width="340" height="60" rx="10"/>
<text class="name mid" x="486" y="80">an EC2 controller</text>
<text class="note mid" x="486" y="98">an EC2 instance: the same pumpkin builds and runs there</text>
<path class="arrow" d="M392 117V164" marker-end="url(#head)"/>
<text class="note" x="400" y="144">pushes</text>
<path class="arrow" d="M580 117V164" marker-end="url(#head)"/>
<text class="note" x="588" y="144">launches</text>
<rect class="box" x="316" y="166" width="152" height="60" rx="8"/>
<text class="name mid" x="392" y="190">ECR repositories</text><text class="note mid" x="392" y="208">private, tagged by digest</text>
<rect class="box" x="504" y="166" width="152" height="60" rx="8"/>
<text class="name mid" x="580" y="190">EC2 instances</text><text class="note mid" x="580" y="208">one sandbox each</text>
<path class="arrow" d="M469 196H502" marker-end="url(#head)"/>
<text class="note mid" x="486" y="188">pull</text>

<rect class="zone" x="696" y="16" width="168" height="272" rx="12"/>
<text class="zone-label" x="712" y="38">A MODAL WORKSPACE</text>
<rect class="box" x="712" y="166" width="136" height="86" rx="8"/>
<text class="name mid" x="780" y="190">Modal sandboxes</text><text class="note mid" x="780" y="208">under gVisor;</text>
<text class="note mid" x="780" y="223">each companion</text>
<text class="note mid" x="780" y="238">a Modal sidecar</text>
<path class="arrow" d="M657 72H780V164" marker-end="url(#head)"/>
<text class="note" x="788" y="122">creates</text>
<path class="arrow" d="M392 227V272H760V254" marker-end="url(#head)"/>
<text class="note mid" x="576" y="264">Modal imports the images</text>

<rect class="zone" x="300" y="304" width="564" height="164" rx="12"/>
<text class="zone-label" x="316" y="326">A DOCKER HOST, AS DEPLOY/DOCKER MAKES IT</text>
<rect class="hot" x="316" y="344" width="532" height="108" rx="10"/>
<text class="name mid" x="424" y="386">a Docker controller</text>
<text class="note mid" x="424" y="404">a privileged container:</text>
<text class="note mid" x="424" y="419">the same pumpkin runs there</text>
<rect class="box" x="532" y="360" width="300" height="76" rx="8"/>
<text class="name mid" x="682" y="384">the container's own Docker engine</text>
<text class="note mid" x="682" y="402">never the host's; it builds every image,</text>
<text class="note mid" x="682" y="417">and the Docker provider's containers run here</text>
</svg>
