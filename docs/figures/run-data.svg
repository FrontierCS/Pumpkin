<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 708" width="880" height="708" role="img" aria-labelledby="title desc">
<title id="title">The data that flows in a run</title>
<desc id="desc">What flows in a run, between the engine's images, the sandboxes, the gateway, the runtime, the decision core, the route, the model provider and the record: each arrow says what it carries, and the code that carries it.</desc>
<style>
:root{--bg:#ffffff;--ink:#1f2328;--mute:#59636e;--line:#818b98;--card:#f6f8fa;--hot:#0969da;--hot-bg:#ddf4ff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#6e7681;--card:#151b23;--hot:#58a6ff;--hot-bg:#10243e}}
text{font:12.5px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.code{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.name{font-size:13px;font-weight:600}
.note{font-size:11.5px;fill:var(--mute)}
.zone-label{font-size:10px;font-weight:700;letter-spacing:.8px;fill:var(--mute)}
.mid{text-anchor:middle}
.bg{fill:var(--bg)}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.25}
.hot{fill:var(--hot-bg);stroke:var(--hot);stroke-width:1.5}
.zone{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:6 4}
.arrow{fill:none;stroke:var(--line);stroke-width:1.5}
.head{fill:var(--line)}
</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L8 4L0 8z"/></marker>
<marker id="tail" viewBox="0 0 8 8" refX="0" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M8 0L0 4L8 8z"/></marker></defs>
<rect class="bg" width="880" height="708"/>
<rect class="box" x="32" y="16" width="184" height="56" rx="8"/>
<text class="name mid" x="124" y="36">the engine</text>
<text class="note mid" x="124" y="53">builds the task's images</text>
<path class="arrow" d="M196 72V158" marker-end="url(#head)"/>
<text class="note" x="206" y="90">images, published · <tspan class="code">publish_image</tspan></text>
<rect class="zone" x="16" y="100" width="208" height="500" rx="12"/>
<text class="zone-label" x="30" y="120">SANDBOXES</text>
<text class="note" x="30" y="136">each runs <tspan class="code">sandboxd</tspan></text>
<text class="note" x="30" y="151">and has one session</text>
<rect class="box" x="32" y="160" width="176" height="170" rx="8"/>
<text class="name mid" x="120" y="180">agent</text>
<text class="note mid" x="120" y="197">the harness, which asks</text>
<text class="note mid" x="120" y="212">the model; and the code</text>
<text class="note mid" x="120" y="227">that makes ops</text>
<rect class="box" x="32" y="350" width="176" height="100" rx="8"/>
<text class="name mid" x="120" y="370">judge</text>
<text class="note mid" x="120" y="387">judges a payload</text>
<rect class="box" x="32" y="470" width="176" height="100" rx="8"/>
<text class="name mid" x="120" y="490">runner</text>
<text class="note mid" x="120" y="507">leased by the agent</text>
<text class="note mid" x="120" y="522">or by a judge</text>
<rect class="zone" x="356" y="100" width="308" height="500" rx="12"/>
<text class="zone-label" x="370" y="120">THE DRIVER</text>
<rect class="box" x="372" y="150" width="64" height="420" rx="8"/>
<text class="code mid" x="404" y="170">gateway</text>
<text class="note mid" x="404" y="187">ends</text>
<text class="note mid" x="404" y="202">of the</text>
<text class="note mid" x="404" y="217">sessions</text>
<rect class="box" x="500" y="150" width="148" height="210" rx="8"/>
<text class="code mid" x="574" y="170">runtime</text>
<text class="note mid" x="574" y="187">carries out the</text>
<text class="note mid" x="574" y="202">core's actions</text>
<rect class="box" x="572" y="400" width="76" height="52" rx="8"/>
<text class="code mid" x="610" y="420">decision</text>
<text class="note mid" x="610" y="437">the core</text>
<rect class="box" x="500" y="496" width="148" height="74" rx="8"/>
<text class="code mid" x="574" y="516">route</text>
<text class="note mid" x="574" y="533">admits a request</text>
<text class="note mid" x="574" y="548">in a closed form</text>
<path class="arrow" d="M371 178H210" marker-end="url(#head)"/>
<text class="note" x="226" y="157">files and stdin, put</text>
<text class="note" x="226" y="172"><tspan class="code">Session</tspan></text>
<path class="arrow" d="M209 232H370" marker-start="url(#tail)" marker-end="url(#head)"/>
<text class="note" x="226" y="211">model requests,</text>
<text class="note" x="226" y="226">answers · <tspan class="code">model</tspan></text>
<path class="arrow" d="M209 290H370" marker-start="url(#tail)" marker-end="url(#head)"/>
<text class="note" x="226" y="269">ops, and the replies</text>
<text class="note" x="226" y="284"><tspan class="code">sandboxctl</tspan></text>
<path class="arrow" d="M371 380H210" marker-end="url(#head)"/>
<text class="note" x="226" y="359">the payload, in its slot</text>
<text class="note" x="226" y="374"><tspan class="code">payloads</tspan></text>
<path class="arrow" d="M209 428H370" marker-end="url(#head)"/>
<text class="note" x="226" y="407">its result, parsed</text>
<text class="note" x="226" y="422"><tspan class="code">ResultSpec</tspan></text>
<path class="arrow" d="M371 500H210" marker-start="url(#tail)" marker-end="url(#head)"/>
<text class="note" x="226" y="479">commands, transfers</text>
<text class="note" x="226" y="494">of a lease · <tspan class="code">lease</tspan></text>
<path class="arrow" d="M209 552H370" marker-end="url(#head)"/>
<text class="note" x="226" y="531">each one's out and log,</text>
<text class="note" x="226" y="546">collected · <tspan class="code">Session</tspan></text>
<path class="arrow" d="M437 200H498" marker-end="url(#head)"/>
<text class="note" x="468" y="192" text-anchor="middle"><tspan class="code">Arrival</tspan></text>
<path class="arrow" d="M499 262H438" marker-end="url(#head)"/>
<text class="note" x="468" y="254" text-anchor="middle"><tspan class="code">Session</tspan></text>
<path class="arrow" d="M610 361V398" marker-start="url(#tail)" marker-end="url(#head)"/>
<text class="note" x="602" y="376" text-anchor="end"><tspan class="code">Event</tspan> in,</text>
<text class="note" x="602" y="391" text-anchor="end"><tspan class="code">Action</tspan> out</text>
<path class="arrow" d="M516 361V494" marker-end="url(#head)"/>
<text class="note" x="524" y="476">requests · <tspan class="code">serve</tspan></text>
<rect class="box" x="500" y="640" width="148" height="52" rx="8"/>
<text class="name mid" x="574" y="660">model provider</text>
<text class="note mid" x="574" y="677">the upstream</text>
<path class="arrow" d="M574 571V638" marker-start="url(#tail)" marker-end="url(#head)"/>
<text class="note" x="584" y="617">the body it admits, with</text>
<text class="note" x="584" y="632">the key; answers · <tspan class="code">Upstream</tspan></text>
<rect class="zone" x="676" y="100" width="188" height="500" rx="12"/>
<text class="zone-label" x="690" y="120">THE RECORD</text>
<rect class="box" x="688" y="150" width="164" height="44" rx="8"/>
<text class="code" x="700" y="170">log.jsonl</text>
<text class="note" x="700" y="186">each event and its actions</text>
<path class="arrow" d="M649 172H686" marker-end="url(#head)"/>
<rect class="box" x="688" y="202" width="164" height="44" rx="8"/>
<text class="code" x="700" y="222">payloads</text>
<text class="note" x="700" y="238">each accepted, by digest</text>
<path class="arrow" d="M649 224H686" marker-end="url(#head)"/>
<rect class="box" x="688" y="254" width="164" height="44" rx="8"/>
<text class="name" x="700" y="274"><tspan class="code">agent</tspan> <tspan class="code">jobs</tspan> <tspan class="code">leases</tspan></text>
<text class="note" x="700" y="290">out, log and console</text>
<path class="arrow" d="M649 276H686" marker-end="url(#head)"/>
<rect class="box" x="688" y="306" width="164" height="44" rx="8"/>
<text class="code" x="700" y="326">outcome.json</text>
<text class="note" x="700" y="342">how the run ended</text>
<path class="arrow" d="M649 328H686" marker-end="url(#head)"/>
<rect class="box" x="688" y="510" width="164" height="44" rx="8"/>
<text class="code" x="700" y="530">model</text>
<text class="note" x="700" y="546">each exchange as it passed</text>
<path class="arrow" d="M649 532H686" marker-end="url(#head)"/>
</svg>
