<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" role="img" aria-labelledby="title desc">
<title id="title">The data between a machine and its controller</title>
<desc id="desc">Between the operator's machine and the controller, over ssh, in each direction: the task's tree goes to the controller's store, by content, and only what the store lacks; a start request to serve sends the configuration and its keys into the job's directory, and the job runs the driver in a systemd unit. What the run says comes back as it is followed. The rows that ls lists, and the ids of the jobs that wait and cancel find a run among, come back from serve, made where the records are, and an ended run's record into the runs directory. The view's requests for the runs' data go to serve on the controller, over one ssh, which reads the controller's runs and sends back each reply.</desc>
<style>
:root{--bg:#ffffff;--ink:#1f2328;--mute:#59636e;--line:#818b98;--card:#f6f8fa;--hot:#0969da;--hot-bg:#ddf4ff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#6e7681;--card:#151b23;--hot:#58a6ff;--hot-bg:#10243e}}
text{font:12.5px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.code{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.name{font-size:13px;font-weight:600}
.note{font-size:11.5px;fill:var(--mute)}
.zone-label{font-size:10px;font-weight:700;letter-spacing:.8px;fill:var(--mute)}
.mid{text-anchor:middle}
.bg{fill:var(--bg)}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.25}
.hot{fill:var(--hot-bg);stroke:var(--hot);stroke-width:1.5}
.zone{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:6 4}
.arrow{fill:none;stroke:var(--line);stroke-width:1.5}
.head{fill:var(--line)}
</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L8 4L0 8z"/></marker>
<marker id="tail" viewBox="0 0 8 8" refX="0" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M8 0L0 4L8 8z"/></marker></defs>
<rect class="bg" width="880" height="700"/>
<text class="note" x="440" y="36" text-anchor="middle">over ssh, on the connections that the workspace's commands share</text>
<rect class="zone" x="16" y="56" width="260" height="624" rx="12"/>
<text class="zone-label" x="30" y="76">THE OPERATOR'S MACHINE</text>
<rect class="box" x="32" y="100" width="228" height="276" rx="8"/>
<text class="name mid" x="146" y="120"><tspan class="code">pumpkin</tspan> <tspan class="code">run</tspan> or <tspan class="code">build</tspan></text>
<text class="note mid" x="146" y="137">hashes the task's tree, sends</text>
<text class="note mid" x="146" y="152">what the store lacks, starts</text>
<text class="note mid" x="146" y="167">the job, and follows it</text>
<rect class="box" x="32" y="396" width="228" height="76" rx="8"/>
<text class="name mid" x="146" y="416"><tspan class="code">pumpkin</tspan> <tspan class="code">ls</tspan></text>
<text class="note mid" x="146" y="433">prints the rows, and those of</text>
<text class="note mid" x="146" y="448">the copies here that they lack</text>
<rect class="box" x="32" y="492" width="228" height="60" rx="8"/>
<text class="name mid" x="146" y="512">the runs directory</text>
<text class="note mid" x="146" y="529">the whole record of each ended run</text>
<rect class="zone" x="604" y="56" width="260" height="624" rx="12"/>
<text class="zone-label" x="618" y="76">THE CONTROLLER</text>
<rect class="box" x="620" y="100" width="228" height="120" rx="8"/>
<text class="name mid" x="734" y="120">the store</text>
<text class="note mid" x="734" y="137">each file named by its SHA-256;</text>
<text class="note mid" x="734" y="152">pieces land in <tspan class="code">INCOMING</tspan>,</text>
<text class="note mid" x="734" y="167">a start takes them in · <tspan class="code">admit</tspan></text>
<rect class="box" x="620" y="236" width="228" height="54" rx="8"/>
<text class="name mid" x="734" y="256">the job's directory</text>
<text class="note mid" x="734" y="273">in tmpfs, which its unit removes</text>
<rect class="box" x="620" y="306" width="228" height="70" rx="8"/>
<text class="code mid" x="734" y="326">job</text>
<text class="note mid" x="734" y="343">a systemd unit that runs the</text>
<text class="note mid" x="734" y="358">driver in a tree of links</text>
<rect class="box" x="620" y="396" width="228" height="130" rx="8"/>
<text class="name mid" x="734" y="416">the controller's runs</text>
<text class="note mid" x="734" y="433">each run's record, as the</text>
<text class="note mid" x="734" y="448">driver writes it</text>
<path class="arrow" d="M262 140H618" marker-end="url(#head)"/>
<text class="note" x="290" y="119">the tree's manifest, by content</text>
<text class="note" x="290" y="134"><tspan class="code">Manifest</tspan> · <tspan class="code">query</tspan></text>
<path class="arrow" d="M618 180H264" marker-end="url(#head)"/>
<text class="note" x="290" y="159">the files the store lacks</text>
<text class="note" x="290" y="174"><tspan class="code">missing</tspan></text>
<path class="arrow" d="M262 218H618" marker-end="url(#head)"/>
<text class="note" x="290" y="197">those pieces, over several</text>
<text class="note" x="290" y="212">connections at once · <tspan class="code">deal</tspan></text>
<path class="arrow" d="M262 270H618" marker-end="url(#head)"/>
<text class="note" x="290" y="249">start the job with its configuration and</text>
<text class="note" x="290" y="264">keys · <tspan class="code">StartRequest</tspan></text>
<path class="arrow" d="M618 350H264" marker-end="url(#head)"/>
<text class="note" x="290" y="329">what the run says, as it is followed</text>
<text class="note" x="290" y="344"><tspan class="code">wait</tspan></text>
<path class="arrow" d="M618 440H264" marker-end="url(#head)"/>
<text class="note" x="290" y="404"><tspan class="code">ls</tspan>: each run's row; <tspan class="code">wait</tspan> and <tspan class="code">cancel</tspan>:</text>
<text class="note" x="290" y="419">the ids of the jobs, made there by</text>
<text class="note" x="290" y="434"><tspan class="code">serve</tspan> · <tspan class="code">Link</tspan></text>
<path class="arrow" d="M618 500H264" marker-end="url(#head)"/>
<text class="note" x="290" y="479">an ended run's record: what differs from</text>
<text class="note" x="290" y="494">the copy here, in one archive · <tspan class="code">copy</tspan></text>
<rect class="box" x="32" y="572" width="228" height="88" rx="8"/>
<text class="name mid" x="146" y="592"><tspan class="code">pumpkin</tspan> <tspan class="code">view</tspan></text>
<text class="note mid" x="146" y="609">serves the page, the token</text>
<text class="note mid" x="146" y="624">and the cancel here</text>
<rect class="box" x="620" y="572" width="228" height="88" rx="8"/>
<text class="name mid" x="734" y="592"><tspan class="code">controller</tspan> <tspan class="code">serve</tspan></text>
<text class="note mid" x="734" y="609">this build's pumpkin, which</text>
<text class="note mid" x="734" y="624">reads the runs where they are</text>
<path class="arrow" d="M734 528V570" marker-end="url(#head)"/>
<path class="arrow" d="M262 604H618" marker-end="url(#head)"/>
<text class="note" x="290" y="583">each request for the runs' data, a frame</text>
<text class="note" x="290" y="598">on standard input · <tspan class="code">Link</tspan></text>
<path class="arrow" d="M618 644H264" marker-end="url(#head)"/>
<text class="note" x="290" y="623">its reply, deflated there, on standard</text>
<text class="note" x="290" y="638">output · <tspan class="code">Viewing</tspan></text>
</svg>
