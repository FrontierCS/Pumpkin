<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 434" width="880" height="434" role="img" aria-labelledby="title desc">
<title id="title">One call of a job function, end to end</title>
<desc id="desc">In the agent's sandbox, sandboxctl call sends the call and its payload over the agent's session to the gateway. The decision core checks the call against the grant, answers at once with the job's number, and has the runtime start the job. The runtime starts a fresh sandbox of the grant's target and evaluates the body, from the sources the record keeps; the body's put, run and get reach the target over its session. Once the body returns, the target is deleted, the core gives the returned dict to the agent's sandboxctl status, and the record keeps the payload, each put, run and get with what they moved, what the body returned or why it failed, and the target's out directory, each command's output and each file the body got.</desc>
<style>
:root{--bg:#ffffff;--ink:#1f2328;--mute:#59636e;--line:#818b98;--card:#f6f8fa;--hot:#0969da;--hot-bg:#ddf4ff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#6e7681;--card:#151b23;--hot:#58a6ff;--hot-bg:#10243e}}
text{font:12.5px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.code{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.name{font-size:13px;font-weight:600}
.note{font-size:11.5px;fill:var(--mute)}
.zone-label{font-size:10px;font-weight:700;letter-spacing:.8px;fill:var(--mute)}
.mid{text-anchor:middle}
.bg{fill:var(--bg)}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.25}
.hot{fill:var(--hot-bg);stroke:var(--hot);stroke-width:1.5}
.zone{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:6 4}
.arrow{fill:none;stroke:var(--line);stroke-width:1.5}
.head{fill:var(--line)}
</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L8 4L0 8z"/></marker></defs>
<rect class="bg" width="880" height="434"/>

<rect class="zone" x="16" y="16" width="200" height="284" rx="12"/>
<text class="zone-label" x="32" y="38">THE AGENT'S SANDBOX</text>
<rect class="box" x="32" y="56" width="168" height="64" rx="8"/>
<text class="code mid" x="116" y="80">sandboxctl call</text>
<text class="note mid" x="116" y="98">the function's name,</text>
<text class="note mid" x="116" y="112">a file for the payload</text>
<rect class="box" x="32" y="208" width="168" height="64" rx="8"/>
<text class="code mid" x="116" y="232">sandboxctl status</text>
<text class="note mid" x="116" y="250">the job's state, and once</text>
<text class="note mid" x="116" y="264">it has ended, the dict</text>

<rect class="zone" x="256" y="16" width="368" height="284" rx="12"/>
<text class="zone-label" x="272" y="38">THE DRIVER</text>
<rect class="box" x="272" y="56" width="336" height="44" rx="8"/>
<text class="mid" x="440" y="83"><tspan class="code">gateway</tspan><tspan class="note">  one end of each sandbox's session</tspan></text>
<rect class="hot" x="272" y="140" width="140" height="132" rx="10"/>
<text class="code mid" x="342" y="164">decision</text>
<text class="note mid" x="342" y="184">checks the call against</text>
<text class="note mid" x="342" y="199">the grant: its payload,</text>
<text class="note mid" x="342" y="214">calls and seconds;</text>
<text class="note mid" x="342" y="229">answers with the job's</text>
<text class="note mid" x="342" y="244">number, and starts it</text>
<rect class="box" x="468" y="140" width="140" height="132" rx="8"/>
<text class="code mid" x="538" y="164">runtime</text>
<text class="note mid" x="538" y="184">starts a fresh target;</text>
<text class="note mid" x="538" y="199">evaluates the body</text>
<text class="note mid" x="538" y="214">from the kept sources;</text>
<text class="note mid" x="538" y="229">deletes the target once</text>
<text class="note mid" x="538" y="244">the body has returned</text>

<rect class="zone" x="664" y="16" width="200" height="284" rx="12"/>
<text class="zone-label" x="680" y="38">A FRESH TARGET</text>
<text class="note" x="680" y="56">a sandbox of the grant's target,</text>
<text class="note" x="680" y="71">for this call alone</text>
<rect class="box" x="680" y="88" width="168" height="52" rx="8"/>
<text class="code mid" x="764" y="110">put</text><text class="note mid" x="764" y="128">the payload, as a file</text>
<rect class="box" x="680" y="152" width="168" height="52" rx="8"/>
<text class="code mid" x="764" y="174">run</text><text class="note mid" x="764" y="192">a command, in its cwd</text>
<rect class="box" x="680" y="216" width="168" height="52" rx="8"/>
<text class="code mid" x="764" y="238">get</text><text class="note mid" x="764" y="256">a file, as text</text>

<path class="arrow" d="M201 78H270" marker-end="url(#head)"/>
<text class="note mid" x="236" y="70">the op</text>
<path class="arrow" d="M342 101V138" marker-end="url(#head)"/>
<path class="arrow" d="M271 160H156V122" marker-end="url(#head)"/>
<text class="note mid" x="236" y="152">job 0</text>
<path class="arrow" d="M413 168H466" marker-end="url(#head)"/>
<path class="arrow" d="M467 244H414" marker-end="url(#head)"/>
<text class="note mid" x="440" y="236">the dict</text>
<path class="arrow" d="M271 240H202" marker-end="url(#head)"/>
<text class="note mid" x="236" y="232">status</text>
<path class="arrow" d="M609 178H678" marker-end="url(#head)"/>

<path class="arrow" d="M538 273V334" marker-end="url(#head)"/>
<text class="note" x="546" y="310">writes</text>
<rect class="box" x="272" y="336" width="336" height="78" rx="8"/>
<text class="name mid" x="440" y="360">the record</text>
<text class="note mid" x="440" y="378">the payload; each put, run and get, with what they moved;</text>
<text class="note mid" x="440" y="392">what the body returned, or why it failed;</text>
<text class="note mid" x="440" y="406">the target's out/, each command's log, each file got</text>
</svg>
