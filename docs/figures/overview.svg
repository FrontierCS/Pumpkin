<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" role="img" aria-labelledby="title desc">
<title id="title">From a task's sources to a run and its record</title>
<desc id="desc">A task's sources, its entry file, the files it loads and its images' recipes, go to pumpkin, which evaluates them to the workflow IR and builds the images. The driver, one process for each run, reads the IR and the images, evaluates the functions' bodies from the text of the files the evaluation read, and has a provider create a sandbox for each instance of a role. A sandbox holds main and, for a runner, its companions, and each container has a session of its own to the driver, its only way out of the sandbox. The driver writes the run's record as the run goes, and pumpkin wait, pumpkin ls and the page read that record.</desc>
<style>
:root{--bg:#ffffff;--ink:#1f2328;--mute:#59636e;--line:#818b98;--card:#f6f8fa;--hot:#0969da;--hot-bg:#ddf4ff}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--mute:#9198a1;--line:#6e7681;--card:#151b23;--hot:#58a6ff;--hot-bg:#10243e}}
text{font:12.5px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.code{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.name{font-size:13px;font-weight:600}
.note{font-size:11.5px;fill:var(--mute)}
.zone-label{font-size:10px;font-weight:700;letter-spacing:.8px;fill:var(--mute)}
.mid{text-anchor:middle}
.bg{fill:var(--bg)}
.box{fill:var(--card);stroke:var(--line);stroke-width:1.25}
.hot{fill:var(--hot-bg);stroke:var(--hot);stroke-width:1.5}
.zone{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:6 4}
.arrow{fill:none;stroke:var(--line);stroke-width:1.5}
.head{fill:var(--line)}
</style>
<defs><marker id="head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="head" d="M0 0L8 4L0 8z"/></marker></defs>
<rect class="bg" width="880" height="408"/>

<rect class="zone" x="16" y="16" width="184" height="236" rx="12"/>
<text class="zone-label" x="32" y="38">THE TASK'S SOURCES</text>
<rect class="box" x="32" y="52" width="152" height="52" rx="8"/>
<text class="name mid" x="108" y="74">the entry file</text><text class="note mid" x="108" y="92">its workflow() call</text>
<rect class="box" x="32" y="116" width="152" height="52" rx="8"/>
<text class="name mid" x="108" y="138">the files it loads</text><text class="note mid" x="108" y="156">the task's and the library's</text>
<rect class="box" x="32" y="180" width="152" height="52" rx="8"/>
<text class="name mid" x="108" y="202">Dockerfiles</text><text class="note mid" x="108" y="220">its images' recipes</text>

<path class="arrow" d="M200 134H238" marker-end="url(#head)"/>
<rect class="box" x="240" y="100" width="148" height="68" rx="8"/>
<text class="code mid" x="314" y="124">pumpkin</text>
<text class="note mid" x="314" y="142">evaluates and checks;</text>
<text class="note mid" x="314" y="157">builds the images</text>

<path class="arrow" d="M388 134H426" marker-end="url(#head)"/>
<rect class="box" x="428" y="92" width="160" height="84" rx="8"/>
<text class="name mid" x="508" y="116">the workflow IR</text>
<text class="note mid" x="508" y="134">data: roles, grants,</text>
<text class="note mid" x="508" y="149">routes, bounds</text>
<text class="name mid" x="508" y="168">and the images</text>

<path class="arrow" d="M508 177V214" marker-end="url(#head)"/>
<rect class="hot" x="428" y="216" width="160" height="80" rx="10"/>
<text class="name mid" x="508" y="240">the driver</text>
<text class="note mid" x="508" y="258">one process for each run;</text>
<text class="note mid" x="508" y="273">reads the IR; evaluates</text>
<text class="note mid" x="508" y="288">bodies from the sources</text>

<rect class="zone" x="664" y="16" width="200" height="280" rx="12"/>
<text class="zone-label" x="680" y="38">SANDBOXES</text>
<text class="note" x="680" y="54">one for each instance of a role,</text>
<text class="note" x="680" y="69">made by a provider:</text>
<text class="note" x="680" y="84">Docker, EC2 or Modal</text>
<rect class="box" x="680" y="100" width="168" height="44" rx="8"/>
<text class="name mid" x="764" y="127">a role's sandbox</text>
<rect class="box" x="680" y="154" width="168" height="72" rx="8"/>
<text class="name mid" x="764" y="175">a runner's sandbox</text>
<rect class="box" x="692" y="186" width="48" height="28" rx="6"/>
<text class="code mid" x="716" y="205">main</text>
<rect class="box" x="748" y="186" width="88" height="28" rx="6"/>
<text class="note mid" x="792" y="204">companions</text>
<text class="note" x="680" y="248">each container has its own</text>
<text class="note" x="680" y="263">session to the driver, its</text>
<text class="note" x="680" y="278">only way out of the sandbox</text>
<path class="arrow" d="M589 248H662" marker-end="url(#head)"/>
<text class="note mid" x="626" y="240">creates</text>

<path class="arrow" d="M508 297V334" marker-end="url(#head)"/>
<text class="note" x="516" y="320">writes as the run goes</text>
<rect class="box" x="428" y="336" width="160" height="52" rx="8"/>
<text class="name mid" x="508" y="358">the record</text><text class="note mid" x="508" y="376">no sandbox can alter it</text>
<path class="arrow" d="M427 362H346" marker-end="url(#head)"/>
<text class="note mid" x="386" y="354">read by</text>
<rect class="box" x="32" y="336" width="312" height="52" rx="8"/>
<text class="mid" x="188" y="358"><tspan class="code">pumpkin wait</tspan>, <tspan class="code">pumpkin ls</tspan> and the page</text>
<text class="note mid" x="188" y="376">so every reader says the same of a run</text>
</svg>
