[profile.default]
# A test still running at 5 s is killed and fails ci: a test that hangs, or one far slower than
# it was. Every test not named below ends within about 3 s, as a bound it waits for on the real
# clock is a whole second, so 5 s leaves room for a busy machine.
slow-timeout = { period = "5s", terminate-after = 1 }

# The shared provider suite waits a second, its `soon()`, for each wait that nothing can end
# sooner, for each of its three subjects.
[[profile.default.overrides]]
filter = 'package(runtime) & test(=conformance::suite)'
slow-timeout = { period = "15s", terminate-after = 1 }

# The tests that need a Docker engine, which `cargo xtask live docker` runs: they build and run
# images, and take a minute or more.
[profile.live]
slow-timeout = { period = "60s", terminate-after = 5 }
