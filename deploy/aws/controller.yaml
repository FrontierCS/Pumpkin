#cloud-config
# The controller's first boot, on Ubuntu 24.04 LTS: the user `pumpkin`, which runs every Pumpkin
# process, lingering, so that its job units outlive every SSH session; what its jobs need, at the
# versions controller.tf names; and two thin units that need no client and no Pumpkin build: the
# idle stop, and the reap at boot once a job has run.
groups:
  - docker
users:
  - default
  - name: pumpkin
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true

# Over HTTPS, the one way out the controller's security group allows.
apt:
  primary:
    - arches: [default]
      uri: ${ubuntu_snapshot}
  security:
    - arches: [default]
      uri: ${ubuntu_snapshot}
  sources:
    docker:
      source: "deb [arch=amd64 signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu noble stable"
      key: |
        ${indent(8, docker_key)}

package_update: true
packages:
  - [docker-ce, "${docker_version}"]
  - [docker-ce-cli, "${docker_version}"]
  - [containerd.io, "${containerd_version}"]
  - [docker-buildx-plugin, "${buildx_version}"]
  - git
  - gcc
  - unzip

write_files:
  # Builds find images by their manifests' digests, which only the containerd image store keeps.
  - path: /etc/docker/daemon.json
    content: |
      {"features": {"containerd-snapshotter": true}}
  # So that a session whose client has gone without a close ends, rather than holding off the idle
  # stop: `sshd`'s peer is the SSM agent, which keeps the connection until Session Manager's idle
  # timeout, so only a probe inside SSH sees the client gone. `sshd` probes after each 30 s in
  # which it has nothing else to do, and ends the session once 3 probes have gone unanswered: about
  # 2 minutes, a little past the 114 s that the agent takes to see its own link to the service dead
  # (a 54 s ping, a 60 s read deadline), so a live session isn't cut while the agent rides out a
  # stall. The first value read wins, so the name sorts before cloud-init's own file.
  # https://github.com/aws/amazon-ssm-agent/blob/9c74eb2e6d5628a0e20e08d088375bb5d7a3d90b/agent/session/plugins/port/port_basic.go#L96-L103
  # https://github.com/aws/amazon-ssm-agent/blob/9c74eb2e6d5628a0e20e08d088375bb5d7a3d90b/agent/session/config/config.go#L46-L47
  # https://github.com/openssh/openssh-portable/blob/5dba72adacbd39736960543373737bc01e35f778/serverloop.c#L111-L141
  # https://github.com/openssh/openssh-portable/blob/5dba72adacbd39736960543373737bc01e35f778/serverloop.c#L240-L251
  - path: /etc/ssh/sshd_config.d/00-pumpkin-keepalive.conf
    content: |
      ClientAliveInterval 30
      ClientAliveCountMax 3
  - path: /usr/local/sbin/pumpkin-idle
    permissions: "0755"
    content: |
      #!/bin/bash
      # Stops the controller, which keeps its volume, once it has had no Pumpkin job and no SSH
      # session for 30 minutes, and has been up for as long.
      set -o errexit -o nounset -o pipefail
      busy=/var/lib/pumpkin/busy
      jobs=$(systemctl --user --machine=pumpkin@ list-units --state=active --no-legend 'pumpkin-job-*')
      ssh=$(loginctl list-sessions --no-legend | awk '{print $1}' \
          | xargs --no-run-if-empty --max-args=1 loginctl show-session --property=Service --value \
          | grep --line-regexp sshd || true)
      if [ -n "$jobs" ] || [ -n "$ssh" ]; then
          install --directory /var/lib/pumpkin && touch "$busy"
      elif [ -z "$(find "$busy" -mmin -30 2>/dev/null)" ] \
          && [ "$(cut --delimiter=. --fields=1 /proc/uptime)" -ge 1800 ]; then
          systemctl poweroff
      fi
  - path: /etc/systemd/system/pumpkin-idle.service
    content: |
      [Unit]
      Description=Stop the Pumpkin controller once it has been idle for 30 minutes

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/pumpkin-idle
  - path: /etc/systemd/system/pumpkin-idle.timer
    content: |
      [Unit]
      Description=Check every 5 minutes whether the Pumpkin controller is idle

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=5min

      [Install]
      WantedBy=timers.target
  # `current-pumpkin` names the Pumpkin that the last job ran, which each job links there.
  - path: /etc/systemd/system/pumpkin-boot.service
    content: |
      [Unit]
      Description=Remove what lost Pumpkin runs left
      ConditionPathExists=/home/pumpkin/current-pumpkin
      Wants=network-online.target
      After=network-online.target docker.service

      [Service]
      Type=oneshot
      User=pumpkin
      ExecStart=/home/pumpkin/current-pumpkin controller boot

      [Install]
      WantedBy=multi-user.target

# cloud-init runs these as one script, so the idle stop is armed first: a controller whose
# install fails below still stops once idle. Then AWS CLI v2's archive, whose SHA-256 is that of
# the one AWS's signature verifies (key FB5D B77F D5C1 18B8 0511 ADA8 A631 0ACC 4672 475C), and
# uv's, whose SHA-256 is the one its release publishes beside it.
runcmd:
  - loginctl enable-linger pumpkin
  - systemctl daemon-reload
  - systemctl enable --now pumpkin-idle.timer pumpkin-boot.service
  - |
    set -o errexit
    cd "$(mktemp --directory)"
    curl --fail --silent --show-error --location --proto '=https' --output awscli.zip \
        https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${aws_cli_version}.zip
    echo '${aws_cli_sha256}  awscli.zip' | sha256sum --check --strict
    unzip -q awscli.zip
    ./aws/install
    curl --fail --silent --show-error --location --proto '=https' --output uv.tar.gz \
        https://github.com/astral-sh/uv/releases/download/${uv_version}/uv-x86_64-unknown-linux-gnu.tar.gz
    echo '${uv_sha256}  uv.tar.gz' | sha256sum --check --strict
    tar --extract --gzip --file=uv.tar.gz
    install --mode=0755 uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
  - systemctl restart docker.service
