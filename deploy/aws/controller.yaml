#cloud-config
# The controller's first boot, on Ubuntu 24.04 LTS. It installs what every controller installs,
# by deploy/controller's install.sh, and what the jobs need beside it on EC2, at the versions that
# controller.tf names. Then it runs the `pumpkin-admin install` of the release that
# `pumpkin_release` pins. That install sets up what Pumpkin relies on there: its user, its units,
# `sshd`'s settings and the members' keys.

write_files:
  - path: /usr/local/lib/pumpkin-controller/install.sh
    permissions: "0755"
    encoding: b64
    content: ${install_script}
  - path: /usr/local/lib/pumpkin-controller/docker.asc
    permissions: "0644"
    encoding: b64
    content: ${docker_key}

# cloud-init runs these as one script, and runs it once. The script stops at the first failure and
# then powers the controller off in 30 minutes, so a controller whose first boot failed costs no
# more than its volume. Each download is pinned by a SHA-256. AWS CLI v2's is that of the archive
# whose signature AWS verifies (key FB5D B77F D5C1 18B8 0511 ADA8 A631 0ACC 4672 475C). Pumpkin's
# is the third word of the `.pumpkinversion` line, after the tag and the commit. uv's is the one
# that its release publishes beside it.
runcmd:
  - |
    set -o errexit
    trap '[ $? -eq 0 ] || shutdown --poweroff +30 "the first boot of the controller failed"' EXIT
    /usr/local/lib/pumpkin-controller/install.sh sources
    /usr/local/lib/pumpkin-controller/install.sh docker unzip
    cd "$(mktemp --directory)"
    curl --fail --silent --show-error --location --proto '=https' --output awscli.zip \
        https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${aws_cli_version}.zip
    echo '${aws_cli_sha256}  awscli.zip' | sha256sum --check --strict
    unzip -q awscli.zip
    ./aws/install
    /usr/local/lib/pumpkin-controller/install.sh release '${pumpkin_release}' pumpkin
    pumpkin/bin/pumpkin-admin install ec2 --settings ${settings_arn}
    curl --fail --silent --show-error --location --proto '=https' --output uv.tar.gz \
        https://github.com/astral-sh/uv/releases/download/${uv_version}/uv-x86_64-unknown-linux-gnu.tar.gz
    echo '${uv_sha256}  uv.tar.gz' | sha256sum --check --strict
    tar --extract --gzip --file=uv.tar.gz
    install --mode=0755 uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
  - systemctl restart docker.service
  # The install enables the boot unit for later boots. Its first run is here, as the prunes of the
  # records and the installs wait for it.
  - systemctl start pumpkin-boot.service
