name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and check the release
        shell: bash
        run: |
          RUSTUP_TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          export RUSTUP_TOOLCHAIN
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl --no-self-update
          .github/release.sh "$TAG"

      - name: Publish the archive and checksum
        working-directory: target/release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" *.tar.xz *.sha256 --verify-tag --title "$TAG" --generate-notes
