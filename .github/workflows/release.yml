# Publishes a release when a tag is pushed: the archive that `deploy/pumpkin` downloads, built
# static for musl, and its `.sha256`, which an operator writes in `.pumpkinversion`.
name: release

on:
  push:
    tags: ["**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
      TARGET: x86_64-unknown-linux-musl
    steps:
      # The whole history, which the bundle of the tag holds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools file
          rustup toolchain install --no-self-update

      - name: Build the archive
        run: |
          CC_x86_64_unknown_linux_musl=musl-gcc cargo xtask install --root dist --target "$TARGET"
          git bundle create dist/pumpkin.bundle "$TAG"
          archive="pumpkin-$TAG-$TARGET.tar.gz"
          tar --create --gzip --owner=0 --group=0 --numeric-owner --file "$archive" \
            --directory dist bin pumpkin.bundle
          sha256sum "$archive" > "$archive.sha256"

      - name: Check the archive
        run: |
          mkdir unpacked
          tar --extract --gzip --file "pumpkin-$TAG-$TARGET.tar.gz" --directory unpacked
          file unpacked/bin/pumpkin
          file unpacked/bin/pumpkin | grep --extended-regexp 'static(-pie)? linked'
          unpacked/bin/pumpkin --version
          unpacked/bin/pumpkin --version | grep --fixed-strings "$(git rev-parse "$TAG^{commit}" | cut --characters=1-9)"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            "pumpkin-$TAG-$TARGET.tar.gz" "pumpkin-$TAG-$TARGET.tar.gz.sha256"
