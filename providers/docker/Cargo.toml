[package]
name = "docker"
version = "0.0.0"
description = "Pumpkin's Docker provider: a sandbox for a role as a container that needs no root to start"
edition.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[dependencies]
provider = { path = "../../crates/provider" }
recipe = { path = "../../crates/recipe" }
schema = { path = "../../crates/schema" }
stdx = { path = "../../crates/stdx" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
gateway = { path = "../../crates/gateway" }
test-support = { path = "../../crates/test-support" }
expect-test.workspace = true

[lints]
workspace = true
