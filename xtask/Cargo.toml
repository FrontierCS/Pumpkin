[package]
name = "xtask"
version.workspace = true
description = "Contributor tasks, run as `cargo xtask <command>`"
edition.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false

[dependencies]
install = { path = "../crates/install" }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
serde_json.workspace = true
sha2.workspace = true
stdx = { path = "../crates/stdx" }
tempfile.workspace = true
toml.workspace = true
xflags.workspace = true

[dev-dependencies]
test-support = { path = "../crates/test-support" }
expect-test.workspace = true

[lints]
workspace = true
