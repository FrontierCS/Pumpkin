[package]
name = "xtask"
version.workspace = true
description = "Contributor tasks, run as `cargo xtask <command>`"
edition.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"
test = false

[dependencies]
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
serde_json.workspace = true
xflags.workspace = true
xshell = "0.2.7"

[dev-dependencies]
expect-test.workspace = true
tempfile.workspace = true

[lints]
workspace = true
