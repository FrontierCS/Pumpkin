allow-expect-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true
too-many-lines-threshold = 70
doc-valid-idents = ["OpenAI", ".."]

disallowed-types = [
    { path = "std::collections::HashMap", replacement = "std::collections::BTreeMap", reason = "its iteration order follows a seed each process draws at random, so the same input could give other records, error lists or decisions" },
    { path = "std::collections::HashSet", replacement = "std::collections::BTreeSet", reason = "its iteration order follows a seed each process draws at random, so the same input could give other records, error lists or decisions" },
    { path = "std::collections::hash_map::RandomState", reason = "it is a seed each process draws at random, which iteration order then follows: key a `BTreeMap` or `BTreeSet` instead" },
]

disallowed-methods = [
    { path = "std::process::Command::new", replacement = "stdx::process::command", reason = "a child gets only the environment its caller states" },
    { path = "std::process::Command::output", replacement = "stdx::process::run", reason = "it waits however long the child runs, where `run` kills the child at the bound that its caller states" },
    { path = "std::process::Command::status", replacement = "stdx::process::run", reason = "it waits however long the child runs, where `run` kills the child at the bound that its caller states" },
    { path = "std::process::Child::wait_with_output", replacement = "stdx::process::run", reason = "it waits however long the child runs, where `run` kills the child at the bound that its caller states" },
    { path = "std::process::Command::spawn", replacement = "stdx::process::spawn", reason = "it leaves its caller's choice of each stream implicit, and a failed start unexplained, where `spawn` makes its caller state each stream and says why a start failed" },
    { path = "std::env::temp_dir", reason = "it leads to the system's temporary directory: a test's scratch is its `test_support::TestDir`, which keeps its last failure's files, and other code's is beside what it makes, through `tempfile::Builder`'s `tempdir_in` or `tempfile_in`" },
    { path = "tempfile::tempdir", reason = "it leads to the system's temporary directory: a test's scratch is its `test_support::TestDir`, which keeps its last failure's files, and other code's is beside what it makes, through `tempfile::Builder`'s `tempdir_in` or `tempfile_in`" },
    { path = "tempfile::TempDir::new", reason = "it leads to the system's temporary directory: a test's scratch is its `test_support::TestDir`, which keeps its last failure's files, and other code's is beside what it makes, through `tempfile::Builder`'s `tempdir_in` or `tempfile_in`" },
    { path = "tempfile::NamedTempFile::new", reason = "it leads to the system's temporary directory: a test's scratch is its `test_support::TestDir`, which keeps its last failure's files, and other code's is beside what it makes, through `tempfile::Builder`'s `tempdir_in` or `tempfile_in`" },
    { path = "std::panic::catch_unwind", reason = "a panic is a bug that ends the whole process, and `AGENTS.md` says never to catch one outside tests: a test observes one by joining the thread that panicked" },
]
