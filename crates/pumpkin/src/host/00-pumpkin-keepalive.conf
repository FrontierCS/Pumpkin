# A client can vanish without closing its session, as a machine that slept or lost its network
# does. These values end such a session within minutes, not when TCP gives up, so it stops
# holding off the idle stop. `sshd` probes the client after each 30 s with nothing else to do. It
# ends the session once 3 probes go unanswered, after about 2 minutes. The first value read wins,
# so this file's name sorts before cloud-init's own file.
# https://github.com/openssh/openssh-portable/blob/5dba72adacbd39736960543373737bc01e35f778/serverloop.c#L111-L141
# https://github.com/openssh/openssh-portable/blob/5dba72adacbd39736960543373737bc01e35f778/serverloop.c#L240-L251
ClientAliveInterval 30
ClientAliveCountMax 3
# Simultaneous commands each open a session, as on SkyPilot's nodes.
MaxStartups 150:30:200
