# `@USER@` admits only the members' keys, each with its forced command. The keys come from a file
# that root owns. No job can append to it, as a job could to `~@USER@/.ssh/authorized_keys`. A
# member who is root through `docker` can change it, and the timer copies the list back within a
# minute. `ssh.service` gives EC2 Instance Connect's command on `sshd`'s command line. That
# command stays for the admin's `ubuntu` alone, as a `Match` block's value replaces it. Both
# keywords hold in `Match`. A key that the file lacks makes `sshd` log that `none` is no absolute
# path:
# https://github.com/openssh/openssh-portable/blob/d76b2675116617394cd355a3437b4963a562b64d/sshd_config.5#L1276-L1292
# https://github.com/openssh/openssh-portable/blob/0ffb46f2ee2ffcc4daf45ee679e484da8fcf338c/servconf.c#L2530-L2540
Match User @USER@
    AuthorizedKeysFile @MEMBERS@
    AuthorizedKeysCommand none
