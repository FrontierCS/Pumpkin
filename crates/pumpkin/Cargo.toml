[package]
name = "pumpkin"
version = "0.0.0"
description = "The `pumpkin` command, which runs workflows"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pumpkin"
path = "src/main.rs"
test = false

[dependencies]
docker = { path = "../../providers/docker" }
provider = { path = "../provider" }
route = { path = "../route" }
runtime = { path = "../runtime" }
schema = { path = "../schema" }
stdx = { path = "../stdx" }
libc.workspace = true
rustix = { workspace = true, features = ["process", "stdio", "thread"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
xflags.workspace = true

[dev-dependencies]
expect-test.workspace = true
tempfile.workspace = true

[lints]
workspace = true
