<svg width="860px" height="1046px" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #AAAAAA }
    .bg { fill: #000000 }
    .fg-bright-cyan { fill: #55FFFF }
    .fg-bright-green { fill: #55FF55 }
    .fg-cyan { fill: #00AAAA }
    .container {
      padding: 0 10px;
      line-height: 18px;
    }
    .bold { font-weight: bold; }
    tspan {
      font: 14px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
      white-space: pre;
      line-height: 18px;
    }
  </style>

  <rect width="100%" height="100%" y="0" rx="4.5" class="bg" />

  <text xml:space="preserve" class="container fg">
    <tspan x="10px" y="28px"><tspan>Build a task and start a run of it.</tspan>
</tspan>
    <tspan x="10px" y="46px">
</tspan>
    <tspan x="10px" y="64px"><tspan>`run` starts a driver process, which builds the task's images, places each role on a provider and</tspan>
</tspan>
    <tspan x="10px" y="82px"><tspan>drives the run. `run` prints the run's id once the run has started, and the run goes on without</tspan>
</tspan>
    <tspan x="10px" y="100px"><tspan>`run`.</tspan>
</tspan>
    <tspan x="10px" y="118px">
</tspan>
    <tspan x="10px" y="136px"><tspan>With `[controllers.&lt;name&gt;]` in the configuration, `run` sends the task to the controller, which</tspan>
</tspan>
    <tspan x="10px" y="154px"><tspan>builds and runs it. `run` then prints the id at once and returns before the build. `pumpkin wait`</tspan>
</tspan>
    <tspan x="10px" y="172px"><tspan>follows the build and the run. `--runs` and `--sandboxd` are refused.</tspan>
</tspan>
    <tspan x="10px" y="190px">
</tspan>
    <tspan x="10px" y="208px"><tspan class="fg-bright-green bold">Usage:</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">pumpkin run</tspan><tspan> </tspan><tspan class="fg-cyan">[OPTIONS]</tspan><tspan> </tspan><tspan class="fg-cyan">&lt;entry&gt;</tspan>
</tspan>
    <tspan x="10px" y="226px">
</tspan>
    <tspan x="10px" y="244px"><tspan class="fg-bright-green bold">Arguments:</tspan>
</tspan>
    <tspan x="10px" y="262px"><tspan>  </tspan><tspan class="fg-cyan">&lt;entry&gt;</tspan>
</tspan>
    <tspan x="10px" y="280px"><tspan>          A task's entry file, below the nearest directory that holds PUMPKIN.star</tspan>
</tspan>
    <tspan x="10px" y="298px">
</tspan>
    <tspan x="10px" y="316px"><tspan class="fg-bright-green bold">Options:</tspan>
</tspan>
    <tspan x="10px" y="334px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--arg</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;name&gt;=&lt;value&gt;</tspan>
</tspan>
    <tspan x="10px" y="352px"><tspan>          Set the arg that an `arg()` call declares as &lt;name&gt;</tspan>
</tspan>
    <tspan x="10px" y="370px">
</tspan>
    <tspan x="10px" y="388px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--runs</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;dir&gt;</tspan>
</tspan>
    <tspan x="10px" y="406px"><tspan>          The directory to record runs in, each in `&lt;dir&gt;/&lt;id&gt;` (default: `runs` in the repository's</tspan>
</tspan>
    <tspan x="10px" y="424px"><tspan>          `.pumpkin`)</tspan>
</tspan>
    <tspan x="10px" y="442px">
</tspan>
    <tspan x="10px" y="460px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--config</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;file&gt;</tspan>
</tspan>
    <tspan x="10px" y="478px"><tspan>          The machine's configuration, which `pumpkin help config` describes (default:</tspan>
</tspan>
    <tspan x="10px" y="496px"><tspan>          `$HOME/.config/pumpkin/pumpkin.toml`)</tspan>
</tspan>
    <tspan x="10px" y="514px">
</tspan>
    <tspan x="10px" y="532px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--controller</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;name&gt;</tspan>
</tspan>
    <tspan x="10px" y="550px"><tspan>          The controller of the configuration's `[controllers.&lt;name&gt;]` to reach (default: its one</tspan>
</tspan>
    <tspan x="10px" y="568px"><tspan>          controller)</tspan>
</tspan>
    <tspan x="10px" y="586px">
</tspan>
    <tspan x="10px" y="604px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--sandboxd</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;path&gt;</tspan>
</tspan>
    <tspan x="10px" y="622px"><tspan>          The static sandboxd that every sandbox runs, with the static ec2-boot beside it (default:</tspan>
</tspan>
    <tspan x="10px" y="640px"><tspan>          the one beside `pumpkin`, where `cargo xtask build` puts both)</tspan>
</tspan>
    <tspan x="10px" y="658px">
</tspan>
    <tspan x="10px" y="676px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--wait</tspan>
</tspan>
    <tspan x="10px" y="694px"><tspan>          Follow the run to its end and exit as `pumpkin wait` does</tspan>
</tspan>
    <tspan x="10px" y="712px">
</tspan>
    <tspan x="10px" y="730px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--outcome</tspan>
</tspan>
    <tspan x="10px" y="748px"><tspan>          Print the run's outcome.json on the standard output once it ends, even if it failed to</tspan>
</tspan>
    <tspan x="10px" y="766px"><tspan>          start</tspan>
</tspan>
    <tspan x="10px" y="784px">
</tspan>
    <tspan x="10px" y="802px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">-h</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--help</tspan>
</tspan>
    <tspan x="10px" y="820px"><tspan>          Print help</tspan>
</tspan>
    <tspan x="10px" y="838px">
</tspan>
    <tspan x="10px" y="856px"><tspan class="fg-bright-green bold">Examples:</tspan>
</tspan>
    <tspan x="10px" y="874px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">pumpkin run tasks/bench/task.star --arg model=model-a</tspan>
</tspan>
    <tspan x="10px" y="892px"><tspan>          Start a run of a task, and print its id</tspan>
</tspan>
    <tspan x="10px" y="910px">
</tspan>
    <tspan x="10px" y="928px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">pumpkin run tasks/bench/task.star --arg model=model-a --wait --outcome</tspan><tspan> \</tspan>
</tspan>
    <tspan x="10px" y="946px"><tspan>    </tspan><tspan class="fg-bright-cyan bold">&gt; outcome.json</tspan>
</tspan>
    <tspan x="10px" y="964px"><tspan>          Start a run, follow it to its end, and save its outcome.json</tspan>
</tspan>
    <tspan x="10px" y="982px">
</tspan>
    <tspan x="10px" y="1000px"><tspan>How a run is placed and how it outlives a logout:</tspan>
</tspan>
    <tspan x="10px" y="1018px"><tspan>https://github.com/FrontierCS/Pumpkin/blob/main/docs/running.md#running</tspan>
</tspan>
    <tspan x="10px" y="1036px">
</tspan>
  </text>

</svg>
