<svg width="860px" height="596px" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #AAAAAA }
    .bg { fill: #000000 }
    .fg-bright-cyan { fill: #55FFFF }
    .fg-bright-green { fill: #55FF55 }
    .fg-cyan { fill: #00AAAA }
    .container {
      padding: 0 10px;
      line-height: 18px;
    }
    .bold { font-weight: bold; }
    tspan {
      font: 14px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
      white-space: pre;
      line-height: 18px;
    }
  </style>

  <rect width="100%" height="100%" y="0" rx="4.5" class="bg" />

  <text xml:space="preserve" class="container fg">
    <tspan x="10px" y="28px"><tspan>Serve the runs to this machine's browser.</tspan>
</tspan>
    <tspan x="10px" y="46px">
</tspan>
    <tspan x="10px" y="64px"><tspan>`view` prints the address to open and serves until a signal stops it. It listens on 127.0.0.1 alone</tspan>
</tspan>
    <tspan x="10px" y="82px"><tspan>and needs the token in the address. The page lists the runs newest first, each as `ls` says it. A</tspan>
</tspan>
    <tspan x="10px" y="100px"><tspan>run's page shows its summary, its sandboxes' lanes, who talks to whom and its log. The page changes</tspan>
</tspan>
    <tspan x="10px" y="118px"><tspan>a run only by a cancel, which runs `pumpkin cancel`. With `[controller]` in the configuration and no</tspan>
</tspan>
    <tspan x="10px" y="136px"><tspan>`--runs`, `view` serves the controller's runs.</tspan>
</tspan>
    <tspan x="10px" y="154px">
</tspan>
    <tspan x="10px" y="172px"><tspan class="fg-bright-green bold">Usage:</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">pumpkin view</tspan><tspan> </tspan><tspan class="fg-cyan">[OPTIONS]</tspan>
</tspan>
    <tspan x="10px" y="190px">
</tspan>
    <tspan x="10px" y="208px"><tspan class="fg-bright-green bold">Options:</tspan>
</tspan>
    <tspan x="10px" y="226px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--runs</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;dir&gt;</tspan>
</tspan>
    <tspan x="10px" y="244px"><tspan>          The directory of the runs to serve (default: `runs` in the repository's `.pumpkin`)</tspan>
</tspan>
    <tspan x="10px" y="262px">
</tspan>
    <tspan x="10px" y="280px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--port</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;port&gt;</tspan>
</tspan>
    <tspan x="10px" y="298px"><tspan>          The port on 127.0.0.1 to serve at (default: a free one)</tspan>
</tspan>
    <tspan x="10px" y="316px">
</tspan>
    <tspan x="10px" y="334px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">-h</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--help</tspan>
</tspan>
    <tspan x="10px" y="352px"><tspan>          Print help</tspan>
</tspan>
    <tspan x="10px" y="370px">
</tspan>
    <tspan x="10px" y="388px"><tspan class="fg-bright-green bold">Examples:</tspan>
</tspan>
    <tspan x="10px" y="406px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">pumpkin view</tspan>
</tspan>
    <tspan x="10px" y="424px"><tspan>          Serve the runs in the repository's `.pumpkin`</tspan>
</tspan>
    <tspan x="10px" y="442px">
</tspan>
    <tspan x="10px" y="460px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">pumpkin view --runs runs --port 8080</tspan>
</tspan>
    <tspan x="10px" y="478px"><tspan>          Serve the runs recorded in `runs` at port 8080</tspan>
</tspan>
    <tspan x="10px" y="496px">
</tspan>
    <tspan x="10px" y="514px"><tspan>`view` serves until a signal stops it, so it never exits 0.</tspan>
</tspan>
    <tspan x="10px" y="532px">
</tspan>
    <tspan x="10px" y="550px"><tspan>What the page shows:</tspan>
</tspan>
    <tspan x="10px" y="568px"><tspan>https://github.com/FrontierCS/Pumpkin/blob/main/docs/record.md#the-page</tspan>
</tspan>
    <tspan x="10px" y="586px">
</tspan>
  </text>

</svg>
