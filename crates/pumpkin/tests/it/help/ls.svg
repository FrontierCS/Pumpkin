<svg width="860px" height="740px" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #AAAAAA }
    .bg { fill: #000000 }
    .fg-bright-cyan { fill: #55FFFF }
    .fg-bright-green { fill: #55FF55 }
    .fg-cyan { fill: #00AAAA }
    .container {
      padding: 0 10px;
      line-height: 18px;
    }
    .bold { font-weight: bold; }
    tspan {
      font: 14px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
      white-space: pre;
      line-height: 18px;
    }
  </style>

  <rect width="100%" height="100%" y="0" rx="4.5" class="bg" />

  <text xml:space="preserve" class="container fg">
    <tspan x="10px" y="28px"><tspan>List runs and their states.</tspan>
</tspan>
    <tspan x="10px" y="46px">
</tspan>
    <tspan x="10px" y="64px"><tspan>`ls` prints a line for each run, oldest first, then a line of totals. Without a prefix, it lists the</tspan>
</tspan>
    <tspan x="10px" y="82px"><tspan>runs that are live or ended within the last day, and the totals say how to list the others. A live</tspan>
</tspan>
    <tspan x="10px" y="100px"><tspan>run's line gives its phase and the bound on it. An ended run's line gives its state, how long it ran</tspan>
</tspan>
    <tspan x="10px" y="118px"><tspan>and its result's values, cut short if they are long. `pumpkin wait --outcome` prints them whole. If</tspan>
</tspan>
    <tspan x="10px" y="136px"><tspan>a run can't be listed, `ls` says why and lists the others. With `[controllers.&lt;name&gt;]` in the</tspan>
</tspan>
    <tspan x="10px" y="154px"><tspan>configuration and no `--runs`, `ls` lists the controller's runs beside this machine's copies of</tspan>
</tspan>
    <tspan x="10px" y="172px"><tspan>them.</tspan>
</tspan>
    <tspan x="10px" y="190px">
</tspan>
    <tspan x="10px" y="208px"><tspan class="fg-bright-green bold">Usage:</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">pumpkin ls</tspan><tspan> </tspan><tspan class="fg-cyan">[OPTIONS]</tspan><tspan> </tspan><tspan class="fg-cyan">[prefix]...</tspan>
</tspan>
    <tspan x="10px" y="226px">
</tspan>
    <tspan x="10px" y="244px"><tspan class="fg-bright-green bold">Arguments:</tspan>
</tspan>
    <tspan x="10px" y="262px"><tspan>  </tspan><tspan class="fg-cyan">[prefix]...</tspan>
</tspan>
    <tspan x="10px" y="280px"><tspan>          A prefix of the ids of the runs to list, such as a day's in UTC, as `20261110`</tspan>
</tspan>
    <tspan x="10px" y="298px">
</tspan>
    <tspan x="10px" y="316px"><tspan class="fg-bright-green bold">Options:</tspan>
</tspan>
    <tspan x="10px" y="334px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--runs</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;dir&gt;</tspan>
</tspan>
    <tspan x="10px" y="352px"><tspan>          The directory of the runs to list (default: `runs` in the repository's `.pumpkin`)</tspan>
</tspan>
    <tspan x="10px" y="370px">
</tspan>
    <tspan x="10px" y="388px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--controller</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;name&gt;</tspan>
</tspan>
    <tspan x="10px" y="406px"><tspan>          The controller of the configuration's `[controllers.&lt;name&gt;]` to reach (default: its one</tspan>
</tspan>
    <tspan x="10px" y="424px"><tspan>          controller)</tspan>
</tspan>
    <tspan x="10px" y="442px">
</tspan>
    <tspan x="10px" y="460px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">-h</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--help</tspan>
</tspan>
    <tspan x="10px" y="478px"><tspan>          Print help</tspan>
</tspan>
    <tspan x="10px" y="496px">
</tspan>
    <tspan x="10px" y="514px"><tspan class="fg-bright-green bold">Examples:</tspan>
</tspan>
    <tspan x="10px" y="532px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">pumpkin ls</tspan>
</tspan>
    <tspan x="10px" y="550px"><tspan>          List the runs that are live or ended within the last day</tspan>
</tspan>
    <tspan x="10px" y="568px">
</tspan>
    <tspan x="10px" y="586px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">pumpkin ls 20261110-1</tspan>
</tspan>
    <tspan x="10px" y="604px"><tspan>          List the runs whose ids start with `20261110-1`</tspan>
</tspan>
    <tspan x="10px" y="622px">
</tspan>
    <tspan x="10px" y="640px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">pumpkin ls --runs runs</tspan>
</tspan>
    <tspan x="10px" y="658px"><tspan>          List the runs recorded in `runs`</tspan>
</tspan>
    <tspan x="10px" y="676px">
</tspan>
    <tspan x="10px" y="694px"><tspan>The phases and states:</tspan>
</tspan>
    <tspan x="10px" y="712px"><tspan>https://github.com/FrontierCS/Pumpkin/blob/main/docs/running.md#following-and-listing-runs</tspan>
</tspan>
    <tspan x="10px" y="730px">
</tspan>
  </text>

</svg>
