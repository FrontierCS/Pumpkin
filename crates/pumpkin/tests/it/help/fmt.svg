<svg width="852px" height="506px" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #AAAAAA }
    .bg { fill: #000000 }
    .fg-bright-cyan { fill: #55FFFF }
    .fg-bright-green { fill: #55FF55 }
    .fg-cyan { fill: #00AAAA }
    .container {
      padding: 0 10px;
      line-height: 18px;
    }
    .bold { font-weight: bold; }
    tspan {
      font: 14px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
      white-space: pre;
      line-height: 18px;
    }
  </style>

  <rect width="100%" height="100%" y="0" rx="4.5" class="bg" />

  <text xml:space="preserve" class="container fg">
    <tspan x="10px" y="28px"><tspan>Format `.star` files.</tspan>
</tspan>
    <tspan x="10px" y="46px">
</tspan>
    <tspan x="10px" y="64px"><tspan>`fmt` rewrites each `.star` file in the one style of the workflow language. It formats the files it</tspan>
</tspan>
    <tspan x="10px" y="82px"><tspan>is given and the `.star` files below the directories it is given. Below a directory, it skips names</tspan>
</tspan>
    <tspan x="10px" y="100px"><tspan>that start with `.` and anything a symbolic link leads to. If a file can't be formatted, `fmt` says</tspan>
</tspan>
    <tspan x="10px" y="118px"><tspan>why and formats the others. It prints nothing on success.</tspan>
</tspan>
    <tspan x="10px" y="136px">
</tspan>
    <tspan x="10px" y="154px"><tspan class="fg-bright-green bold">Usage:</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">pumpkin fmt</tspan><tspan> </tspan><tspan class="fg-cyan">[OPTIONS]</tspan><tspan> </tspan><tspan class="fg-cyan">[path]...</tspan>
</tspan>
    <tspan x="10px" y="172px">
</tspan>
    <tspan x="10px" y="190px"><tspan class="fg-bright-green bold">Arguments:</tspan>
</tspan>
    <tspan x="10px" y="208px"><tspan>  </tspan><tspan class="fg-cyan">[path]...</tspan>
</tspan>
    <tspan x="10px" y="226px"><tspan>          A `.star` file or a directory to format (default: the working directory)</tspan>
</tspan>
    <tspan x="10px" y="244px">
</tspan>
    <tspan x="10px" y="262px"><tspan class="fg-bright-green bold">Options:</tspan>
</tspan>
    <tspan x="10px" y="280px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--check</tspan>
</tspan>
    <tspan x="10px" y="298px"><tspan>          Name each file that isn't formatted, change none, and fail if there is one</tspan>
</tspan>
    <tspan x="10px" y="316px">
</tspan>
    <tspan x="10px" y="334px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">-h</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--help</tspan>
</tspan>
    <tspan x="10px" y="352px"><tspan>          Print help</tspan>
</tspan>
    <tspan x="10px" y="370px">
</tspan>
    <tspan x="10px" y="388px"><tspan class="fg-bright-green bold">Examples:</tspan>
</tspan>
    <tspan x="10px" y="406px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">pumpkin fmt</tspan>
</tspan>
    <tspan x="10px" y="424px"><tspan>          Format every `.star` file below the working directory</tspan>
</tspan>
    <tspan x="10px" y="442px">
</tspan>
    <tspan x="10px" y="460px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">pumpkin fmt --check lib tasks/bench/task.star</tspan>
</tspan>
    <tspan x="10px" y="478px"><tspan>          Check that `lib` and a task's entry are formatted, and change nothing</tspan>
</tspan>
    <tspan x="10px" y="496px">
</tspan>
  </text>

</svg>
