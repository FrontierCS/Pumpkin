<svg width="860px" height="830px" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #AAAAAA }
    .bg { fill: #000000 }
    .fg-bright-cyan { fill: #55FFFF }
    .fg-bright-green { fill: #55FF55 }
    .fg-cyan { fill: #00AAAA }
    .container {
      padding: 0 10px;
      line-height: 18px;
    }
    .bold { font-weight: bold; }
    tspan {
      font: 14px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
      white-space: pre;
      line-height: 18px;
    }
  </style>

  <rect width="100%" height="100%" y="0" rx="4.5" class="bg" />

  <text xml:space="preserve" class="container fg">
    <tspan x="10px" y="28px"><tspan>Install the controller host's software, as root.</tspan>
</tspan>
    <tspan x="10px" y="46px">
</tspan>
    <tspan x="10px" y="64px"><tspan>`install` makes the user `pumpkin`, lingering, in Docker's group. It installs this `pumpkin-admin`,</tspan>
</tspan>
    <tspan x="10px" y="82px"><tspan>the host file /etc/pumpkin/controller.toml, the units that run `boot-all`, `members` and, on `ec2`,</tspan>
</tspan>
    <tspan x="10px" y="100px"><tspan>`idle`, and sshd's settings, which admit only the members' keys.</tspan>
</tspan>
    <tspan x="10px" y="118px">
</tspan>
    <tspan x="10px" y="136px"><tspan>It copies the members' keys first, and changes nothing else if the copy fails. It needs Docker</tspan>
</tspan>
    <tspan x="10px" y="154px"><tspan>installed first, and AWS CLI v2 to read SSM. It writes a file only where it differs, reloads only</tspan>
</tspan>
    <tspan x="10px" y="172px"><tspan>what changed, and says each change, so a second run says nothing.</tspan>
</tspan>
    <tspan x="10px" y="190px">
</tspan>
    <tspan x="10px" y="208px"><tspan class="fg-bright-green bold">Usage:</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">pumpkin-admin install</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">--settings</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;settings&gt;</tspan><tspan> </tspan><tspan class="fg-cyan">&lt;target&gt;</tspan>
</tspan>
    <tspan x="10px" y="226px">
</tspan>
    <tspan x="10px" y="244px"><tspan class="fg-bright-green bold">Arguments:</tspan>
</tspan>
    <tspan x="10px" y="262px"><tspan>  </tspan><tspan class="fg-cyan">&lt;target&gt;</tspan>
</tspan>
    <tspan x="10px" y="280px"><tspan>          What the controller runs on</tspan>
</tspan>
    <tspan x="10px" y="298px">
</tspan>
    <tspan x="10px" y="316px"><tspan>          Possible values:</tspan>
</tspan>
    <tspan x="10px" y="334px"><tspan>          - </tspan><tspan class="fg-bright-cyan bold">ec2</tspan><tspan>:    An EC2 instance that deploy/aws made. It stops once idle, and a client starts it</tspan>
</tspan>
    <tspan x="10px" y="352px"><tspan>            again</tspan>
</tspan>
    <tspan x="10px" y="370px"><tspan>          - </tspan><tspan class="fg-bright-cyan bold">docker</tspan><tspan>: The container that deploy/docker makes. It never stops by itself</tspan>
</tspan>
    <tspan x="10px" y="388px">
</tspan>
    <tspan x="10px" y="406px"><tspan class="fg-bright-green bold">Options:</tspan>
</tspan>
    <tspan x="10px" y="424px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--settings</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;settings&gt;</tspan>
</tspan>
    <tspan x="10px" y="442px"><tspan>          Where the controller's settings are: on `ec2`, the ARN of their SSM parameter; on</tspan>
</tspan>
    <tspan x="10px" y="460px"><tspan>          `docker`, the absolute path of their file. The host file names it</tspan>
</tspan>
    <tspan x="10px" y="478px">
</tspan>
    <tspan x="10px" y="496px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">-h</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--help</tspan>
</tspan>
    <tspan x="10px" y="514px"><tspan>          Print help</tspan>
</tspan>
    <tspan x="10px" y="532px">
</tspan>
    <tspan x="10px" y="550px"><tspan class="fg-bright-green bold">Examples:</tspan>
</tspan>
    <tspan x="10px" y="568px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">sudo ./pumpkin/bin/pumpkin-admin install ec2 --settings</tspan><tspan> \</tspan>
</tspan>
    <tspan x="10px" y="586px"><tspan>    </tspan><tspan class="fg-bright-cyan bold">arn:aws:ssm:us-west-1:123456789012:parameter/pumpkin-alice/settings</tspan>
</tspan>
    <tspan x="10px" y="604px"><tspan>          Install this release on the controller's EC2 instance, as root</tspan>
</tspan>
    <tspan x="10px" y="622px">
</tspan>
    <tspan x="10px" y="640px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">pumpkin-admin install docker --settings /etc/pumpkin/conf/settings.toml</tspan>
</tspan>
    <tspan x="10px" y="658px"><tspan>          Install it in the controller's container, as its image does at every</tspan>
</tspan>
    <tspan x="10px" y="676px"><tspan>          start</tspan>
</tspan>
    <tspan x="10px" y="694px">
</tspan>
    <tspan x="10px" y="712px"><tspan>The settings name the members' list in their `[deployment] members`: an SSM</tspan>
</tspan>
    <tspan x="10px" y="730px"><tspan>parameter's ARN, or a file's absolute path. The list holds a line `&lt;member&gt;</tspan>
</tspan>
    <tspan x="10px" y="748px"><tspan>&lt;key&gt;` for each key. A member's name is 1 to 32 of a-z, 0-9 and `-`, and starts</tspan>
</tspan>
    <tspan x="10px" y="766px"><tspan>with a letter. The key is the line of the member's</tspan>
</tspan>
    <tspan x="10px" y="784px"><tspan>~/.config/pumpkin/ssh/key.pub. A list with any other line, or a key twice, is</tspan>
</tspan>
    <tspan x="10px" y="802px"><tspan>refused whole.</tspan>
</tspan>
    <tspan x="10px" y="820px">
</tspan>
  </text>

</svg>
