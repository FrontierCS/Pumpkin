<svg width="860px" height="542px" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #AAAAAA }
    .bg { fill: #000000 }
    .fg-bright-cyan { fill: #55FFFF }
    .fg-bright-green { fill: #55FF55 }
    .fg-cyan { fill: #00AAAA }
    .container {
      padding: 0 10px;
      line-height: 18px;
    }
    .bold { font-weight: bold; }
    tspan {
      font: 14px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
      white-space: pre;
      line-height: 18px;
    }
  </style>

  <rect width="100%" height="100%" y="0" rx="4.5" class="bg" />

  <text xml:space="preserve" class="container fg">
    <tspan x="10px" y="28px"><tspan>Install the controller host's software, as root.</tspan>
</tspan>
    <tspan x="10px" y="46px">
</tspan>
    <tspan x="10px" y="64px"><tspan>`install` makes the user `pumpkin`, lingering, in Docker's group. It installs this `pumpkin-admin`,</tspan>
</tspan>
    <tspan x="10px" y="82px"><tspan>the host file /etc/pumpkin/controller.toml, the units that run `boot-all`, `idle` and `members`, and</tspan>
</tspan>
    <tspan x="10px" y="100px"><tspan>sshd's settings. Those admit only the members' keys for `pumpkin`.</tspan>
</tspan>
    <tspan x="10px" y="118px">
</tspan>
    <tspan x="10px" y="136px"><tspan>It copies the members' keys first, and changes nothing else if the copy fails. It needs Docker and</tspan>
</tspan>
    <tspan x="10px" y="154px"><tspan>AWS CLI v2 installed first. It writes a file only where it differs, reloads only what changed, and</tspan>
</tspan>
    <tspan x="10px" y="172px"><tspan>says each change, so a second run says nothing.</tspan>
</tspan>
    <tspan x="10px" y="190px">
</tspan>
    <tspan x="10px" y="208px"><tspan class="fg-bright-green bold">Usage:</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">pumpkin-admin install</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">--settings</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;arn&gt;</tspan>
</tspan>
    <tspan x="10px" y="226px">
</tspan>
    <tspan x="10px" y="244px"><tspan class="fg-bright-green bold">Options:</tspan>
</tspan>
    <tspan x="10px" y="262px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--settings</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;arn&gt;</tspan>
</tspan>
    <tspan x="10px" y="280px"><tspan>          The ARN of the SSM parameter that holds the controller's settings. The host file names it</tspan>
</tspan>
    <tspan x="10px" y="298px">
</tspan>
    <tspan x="10px" y="316px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">-h</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--help</tspan>
</tspan>
    <tspan x="10px" y="334px"><tspan>          Print help</tspan>
</tspan>
    <tspan x="10px" y="352px">
</tspan>
    <tspan x="10px" y="370px"><tspan>The settings name the members' list in their `[deployment] members`. The list</tspan>
</tspan>
    <tspan x="10px" y="388px"><tspan>holds a line `&lt;member&gt; &lt;key&gt;` for each key. A member's name is 1 to 32 of a-z,</tspan>
</tspan>
    <tspan x="10px" y="406px"><tspan>0-9 and `-`, and starts with a letter. The key is the line of the member's</tspan>
</tspan>
    <tspan x="10px" y="424px"><tspan>~/.config/pumpkin/ssh/key.pub. A list with any other line, or a key twice, is</tspan>
</tspan>
    <tspan x="10px" y="442px"><tspan>refused whole.</tspan>
</tspan>
    <tspan x="10px" y="460px">
</tspan>
    <tspan x="10px" y="478px"><tspan class="fg-bright-green bold">Examples:</tspan>
</tspan>
    <tspan x="10px" y="496px"><tspan>  sudo ./pumpkin/bin/pumpkin-admin install \</tspan>
</tspan>
    <tspan x="10px" y="514px"><tspan>    --settings arn:aws:ssm:us-west-1:123456789012:parameter/pumpkin-alice/settings</tspan>
</tspan>
    <tspan x="10px" y="532px">
</tspan>
  </text>

</svg>
