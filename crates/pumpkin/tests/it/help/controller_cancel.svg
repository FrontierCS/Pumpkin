<svg width="852px" height="416px" xmlns="http://www.w3.org/2000/svg">
  <style>
    .fg { fill: #AAAAAA }
    .bg { fill: #000000 }
    .fg-bright-cyan { fill: #55FFFF }
    .fg-bright-green { fill: #55FF55 }
    .fg-cyan { fill: #00AAAA }
    .container {
      padding: 0 10px;
      line-height: 18px;
    }
    .bold { font-weight: bold; }
    tspan {
      font: 14px SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace;
      white-space: pre;
      line-height: 18px;
    }
  </style>

  <rect width="100%" height="100%" y="0" rx="4.5" class="bg" />

  <text xml:space="preserve" class="container fg">
    <tspan x="10px" y="28px"><tspan>Cancel a run for a client.</tspan>
</tspan>
    <tspan x="10px" y="46px">
</tspan>
    <tspan x="10px" y="64px"><tspan>The client then says how the run ended, from its copy of the record.</tspan>
</tspan>
    <tspan x="10px" y="82px">
</tspan>
    <tspan x="10px" y="100px"><tspan class="fg-bright-green bold">Usage:</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">pumpkin controller cancel</tspan><tspan> </tspan><tspan class="fg-cyan">[OPTIONS]</tspan><tspan> </tspan><tspan class="fg-cyan">&lt;run&gt;</tspan>
</tspan>
    <tspan x="10px" y="118px">
</tspan>
    <tspan x="10px" y="136px"><tspan class="fg-bright-green bold">Arguments:</tspan>
</tspan>
    <tspan x="10px" y="154px"><tspan>  </tspan><tspan class="fg-cyan">&lt;run&gt;</tspan>
</tspan>
    <tspan x="10px" y="172px"><tspan>          The run's id, a prefix of the id or of its last 8 digits that no other run shares, or its</tspan>
</tspan>
    <tspan x="10px" y="190px"><tspan>          record's path with a `/`</tspan>
</tspan>
    <tspan x="10px" y="208px">
</tspan>
    <tspan x="10px" y="226px"><tspan class="fg-bright-green bold">Options:</tspan>
</tspan>
    <tspan x="10px" y="244px"><tspan>      </tspan><tspan class="fg-bright-cyan bold">--runs</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;dir&gt;</tspan>
</tspan>
    <tspan x="10px" y="262px"><tspan>          The directory to look the run up in (default: `runs` in the repository's `.pumpkin`)</tspan>
</tspan>
    <tspan x="10px" y="280px">
</tspan>
    <tspan x="10px" y="298px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">-h</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--help</tspan>
</tspan>
    <tspan x="10px" y="316px"><tspan>          Print help</tspan>
</tspan>
    <tspan x="10px" y="334px">
</tspan>
    <tspan x="10px" y="352px"><tspan class="fg-bright-green bold">Exit status:</tspan>
</tspan>
    <tspan x="10px" y="370px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">102</tspan><tspan>  The run has ended. The client copies its record.</tspan>
</tspan>
    <tspan x="10px" y="388px"><tspan>  </tspan><tspan class="fg-bright-cyan bold">103</tspan><tspan>  The run has ended, but one of its providers can't be reached.</tspan>
</tspan>
    <tspan x="10px" y="406px">
</tspan>
  </text>

</svg>
