[package]
name = "pumpkin-cli"
version = "0.0.0"
description = "The `pumpkin` command, which runs workflows"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pumpkin"
path = "src/main.rs"
test = false
# The library `pumpkin` has the same name, and both would be documented at `pumpkin/`.
doc = false

[dependencies]
pumpkin = { path = "../pumpkin" }
pumpkin-docker = { path = "../../providers/docker" }
pumpkin-schema = { path = "../pumpkin-schema" }
stdx = { path = "../stdx" }
serde_json.workspace = true
xflags.workspace = true

[dev-dependencies]
expect-test.workspace = true

[lints]
workspace = true
