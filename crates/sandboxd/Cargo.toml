[package]
name = "sandboxd"
version.workspace = true
description = "sandboxd, the supervisor in every Pumpkin sandbox"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "sandboxd"
path = "src/main.rs"
test = false

[dependencies]
schema = { path = "../schema" }
stdx = { path = "../stdx" }
libc.workspace = true
rustix = { workspace = true, features = ["net", "process", "thread"] }
serde_json.workspace = true
xflags.workspace = true

[dev-dependencies]
gateway = { path = "../gateway" }
test-support = { path = "../test-support" }
expect-test.workspace = true

[lints]
workspace = true
