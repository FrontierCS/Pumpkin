[package]
name = "pumpkin-frontier-cs"
version = "0.0.0"
description = "The FrontierCS factory, for tasks ported from FrontierCS to Pumpkin"
edition.workspace = true
publish.workspace = true

[lib]
test = false

[[bin]]
name = "pumpkin-frontier-cs"
path = "src/main.rs"
test = false

[dependencies]
pumpkin-docker = { path = "../../providers/docker" }
pumpkin-schema = { path = "../pumpkin-schema" }
stdx = { path = "../stdx" }
serde.workspace = true
serde_json.workspace = true
xflags.workspace = true

[dev-dependencies]
expect-test.workspace = true

[lints]
workspace = true
