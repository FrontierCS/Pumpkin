[workspace]
members = ["crates/*", "providers/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
expect-test = "1"
libc = "0.2.191"
rustix = "1.1.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
sha2 = { version = "0.11.0", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
xflags = "0.3.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# expect-test writes every snapshot as a raw string with hashes.
needless_raw_string_hashes = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
doc_paragraphs_missing_punctuation = "warn"
expect_used = "warn"
get_unwrap = "warn"
infinite_loop = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
unimplemented = "warn"
unwrap_used = "warn"
use_self = "warn"

# Dependencies get line tables only, which backtraces need, and build faster without the rest of
# their debug info; the workspace's crates keep it all. Build scripts and proc macros, which Cargo
# otherwise builds without debug info, get line tables too, since this setting takes precedence.
[profile.dev.package."*"]
debug = "line-tables-only"

# A panic is a bug, so it ends the whole process, as `unreachable!` is meant to: under
# unwinding, one in a thread would end only that thread. Release builds abort. Dev builds
# unwind, which Cargo forces on tests anyway, so that `cargo test` builds each library once for
# both the tests and the binaries they run; the binaries abort from a panic hook instead
# (`stdx::abort_on_panic`).
[profile.release]
panic = "abort"
# An overflow is a bug too, so release builds check for it, as dev builds do, rather than wrap.
overflow-checks = true
