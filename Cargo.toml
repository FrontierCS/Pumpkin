[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
expect-test = "1"
libc = "0.2.191"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
xflags = "0.3.2"

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# expect-test writes every snapshot as a raw string with hashes.
needless_raw_string_hashes = "allow"
dbg_macro = "warn"
doc_paragraphs_missing_punctuation = "warn"
expect_used = "warn"
get_unwrap = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
too_long_first_doc_paragraph = "warn"
unreachable = "warn"
unwrap_used = "warn"
use_self = "warn"

# A panic is a bug, so it ends the whole process, as `unreachable!` is meant to: under
# unwinding, one in a thread would end only that thread. Cargo ignores `panic` for tests and
# benches, which keep unwinding.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
