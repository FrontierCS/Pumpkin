[workspace]
members = ["crates/*", "providers/*", "providers/ec2/boot", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
expect-test = "1"
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
libc = "0.2.191"
mimalloc = "0.1.52"
miniz_oxide = "0.9.1"
rustix = "1.1.6"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
sha2 = { version = "0.11.0", default-features = false }
tempfile = { version = "3.27.0", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["display", "parse", "serde"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
webpki-roots = "1.0.11"
xflags = "0.3.2"

[workspace.lints.rust]
# Denied, not forbidden, so that `stdx`'s one signal helper can expect it.
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# expect-test writes every snapshot as a raw string with hashes.
needless_raw_string_hashes = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
doc_paragraphs_missing_punctuation = "warn"
expect_used = "warn"
get_unwrap = "warn"
infinite_loop = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
unimplemented = "warn"
unwrap_used = "warn"
use_self = "warn"

# Line tables only, which give each frame of a backtrace its file and line, as rust-analyzer keeps
# its own crates' debug info limited and matklad's "Fast Rust Builds" advises dropping it:
# https://github.com/rust-lang/rust-analyzer/blob/00825977ae82b9bcb984faede1367eff30ad0314/Cargo.toml#L13-L14
# https://matklad.github.io/2021/09/04/fast-rust-builds.html#CI-Workflow
# The rest of the debug info is most of a debug `pumpkin`, which tests hash and copy, and builds
# take longer to write it.
[profile.dev]
debug = "line-tables-only"

# Build scripts and proc macros, which Cargo otherwise builds without debug info, get line tables
# too, since this setting takes precedence.
[profile.dev.package."*"]
debug = "line-tables-only"

# Optimized, as tests hash files of tens of MiB, which unoptimized SHA-256 takes seconds over.
[profile.dev.package.sha2]
opt-level = 3

# A panic is a bug, so it ends the whole process: under unwinding, one in a thread would end only
# that thread. Dev builds unwind, which Cargo forces on tests anyway, so that `cargo test` builds
# each library once for both the tests and the binaries they run; the binaries abort from a panic
# hook instead (`stdx::abort_on_panic`).
[profile.release]
panic = "abort"
# An overflow is a bug too, so release builds check for it, as dev builds do, rather than wrap.
overflow-checks = true
